name: Publish

# Publishes to npm when you push a version tag, e.g. `v0.1.1`.
# The tag is only a trigger — npm publishes whatever version is in package.json,
# so the job first checks the two agree to avoid a confusing "already published" error.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets npm attach build provenance (public repo only)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version first."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
